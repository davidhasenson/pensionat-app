# -------------------------------------------------------------
# JOB 2: BUILD AND PUSH DOCKER IMAGE TO CONTAINER REGISTRY
# -------------------------------------------------------------
  push-to-container-registry:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        #        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and tags for Docker image
        #        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image to GitHub Container Registry
        #        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image digest
        #        if: github.event_name != 'pull_request'
        run: |
          echo "Image digest is: ${{ steps.build.outputs.digest }}"
          echo "Full image path: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

# -------------------------------------------------------------
# JOB 3: DEPLOY TO STAGING (Automatic on push to master)
# -------------------------------------------------------------
  deploy-staging:
    needs: push-to-container-registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Railway Image Updater
        run: |
          docker run -d --rm --name railway-updater \
            -p 8080:8080 \
            -e RAILWAY_API_TOKEN="${{ secrets.RAILWAY_API_TOKEN }}" \
            ghcr.io/returnearly/railway-image-updater:latest

          #  Vänta 3 sekunder så att webbservern hinner starta
          sleep 3

          curl -X PUT http://localhost:8080/deploy-commit \
            -H "Content-Type: application/json" \
            -d '{
              "project_id": "${{ secrets.RAILWAY_PROJECT_ID }}",
              "environment_id": "${{ secrets.RAILWAY_ENVIRONMENT_ID_STAGING }}",
              "repo_prefixes": ["${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"],
              "commit_sha": "${{ github.sha }}"
            }'

          docker stop railway-updater