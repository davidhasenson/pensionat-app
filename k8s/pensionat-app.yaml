apiVersion: apps/v1
kind: Deployment
metadata:
  name: pensionat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pensionat-app
  template:
    metadata:
      labels:
        app: pensionat-app
    spec:
      containers:
        - name: pensionat-app
          image: pensionat-app
          imagePullPolicy: Never
          ports:
            - containerPort: 8083

---

apiVersion: v1
kind: Service
metadata:
  name: pensionat-app
spec:
  selector:
    app: pensionat-app
  ports:
    - port: 8083
      targetPort: 8083

