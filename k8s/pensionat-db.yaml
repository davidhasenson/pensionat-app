apiVersion: apps/v1
kind: Deployment
metadata:
  name: pensionat-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pensionat-db
  template:
    metadata:
      labels:
        app: pensionat-db
    spec:
      containers:
        - name: mysql
          image: mysql:8
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: pensionatdb
          ports:
            - containerPort: 3306

---

apiVersion: v1
kind: Service
metadata:
  name: pensionat-db
spec:
  selector:
    app: pensionat-db
  ports:
    - port: 3306
      targetPort: 3306

